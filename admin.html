<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N4B LIVE Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { black:"#0a0a0a", dark:"#121212", red:"#e10600" } } } }
    }
  </script>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; }
    input, select, textarea { background:#000; border:1px solid #333; border-radius:8px; padding:10px 12px; width:100%; color:#fff; outline:none; }
    input:focus, select:focus, textarea:focus { border-color:#e10600; }
    .btn { background:#e10600; color:#fff; font-weight:600; padding:10px 20px; border-radius:8px; border:none; cursor:pointer; }
    .btn:hover { background:#b30500; }
    .btn-gray { background:#222; border:1px solid #444; color:#ccc; }
    .btn-gray:hover { background:#333; }
    .card { background:#121212; border:1px solid #2a2a2a; border-radius:12px; padding:20px; }
  </style>
</head>
<body class="min-h-screen p-4">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="max-w-sm mx-auto mt-20">
    <div class="text-center mb-6">
      <div class="mx-auto h-14 w-14 rounded-xl bg-brand-red flex items-center justify-center text-xl font-bold mb-3">N4</div>
      <h1 class="text-2xl font-bold">N4B <span class="text-brand-red">LIVE</span></h1>
      <p class="text-sm text-gray-500">Admin Login</p>
    </div>
    <div class="card">
      <p id="loginError" class="hidden text-red-400 text-sm mb-3"></p>
      <label class="text-sm text-gray-400">Password</label>
      <input type="password" id="loginPass" class="mt-1 mb-4" placeholder="Admin password" />
      <button class="btn w-full" onclick="doLogin()">Sign In</button>
    </div>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden max-w-3xl mx-auto">
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-2">
        <div class="h-8 w-8 rounded bg-brand-red flex items-center justify-center text-sm font-bold">N4</div>
        <span class="font-bold">N4B <span class="text-brand-red">LIVE</span> Admin</span>
      </div>
      <div class="flex gap-2">
        <a href="index.html" target="_blank" class="text-sm text-gray-400 hover:text-white">View Site ↗</a>
        <button class="btn-gray text-sm px-3 py-1 rounded-lg" onclick="doLogout()">Logout</button>
      </div>
    </div>

    <p id="msg" class="hidden fixed top-4 right-4 z-50 px-4 py-2 rounded-lg text-sm font-medium"></p>

    <!-- TABS -->
    <div class="flex flex-wrap gap-2 mb-6">
      <button class="tab-btn btn text-sm" data-tab="stream" onclick="showTab('stream')">Live Stream</button>
      <button class="tab-btn btn-gray text-sm" data-tab="matches" onclick="showTab('matches')">Matches</button>
      <button class="tab-btn btn-gray text-sm" data-tab="settings" onclick="showTab('settings')">Settings</button>
    </div>

    <!-- STREAM TAB -->
    <div id="tab-stream" class="card space-y-4">
      <h2 class="text-lg font-bold">Live Stream Control</h2>
      <div class="flex items-center gap-2">
        <span id="statusDot" class="h-3 w-3 rounded-full bg-gray-600"></span>
        <span class="text-sm text-gray-400">Status: <strong id="statusText">OFFLINE</strong></span>
      </div>
      <div>
        <label class="text-sm text-gray-400">Stream URL (m3u8 / mp4)</label>
        <input type="url" id="streamUrl" placeholder="https://example.com/live/stream.m3u8" class="mt-1" />
        <p class="text-xs text-gray-600 mt-1">Sirf authorized URL use karo. Khali chhodoge to OFFLINE ho jayega.</p>
      </div>
      <div>
        <label class="text-sm text-gray-400">Linked Match (optional)</label>
        <select id="streamMatch" class="mt-1"><option value="">— None —</option></select>
      </div>
      <label class="flex items-center gap-2 text-sm">
        <input type="checkbox" id="isLive" class="accent-red-600" /> Set as LIVE
      </label>
      <div class="flex flex-wrap gap-3">
        <button class="btn" onclick="saveStream()">Save & Apply</button>
        <button class="btn-gray px-5 py-2.5 rounded-lg" onclick="stopStream()">Stop Stream (Offline)</button>
      </div>
    </div>

    <!-- MATCHES TAB -->
    <div id="tab-matches" class="hidden space-y-4">
      <div class="card space-y-3">
        <h2 class="text-lg font-bold" id="matchFormTitle">Add Match</h2>
        <div class="grid sm:grid-cols-2 gap-3">
          <div><label class="text-sm text-gray-400">Team A</label><input id="teamA" placeholder="India" class="mt-1" /></div>
          <div><label class="text-sm text-gray-400">Team B</label><input id="teamB" placeholder="Australia" class="mt-1" /></div>
          <div><label class="text-sm text-gray-400">Date & Time</label><input type="datetime-local" id="matchDate" class="mt-1" /></div>
          <div>
            <label class="text-sm text-gray-400">Status</label>
            <select id="matchStatus" class="mt-1">
              <option value="upcoming">Upcoming</option>
              <option value="live">Live</option>
              <option value="completed">Completed</option>
            </select>
          </div>
          <div class="sm:col-span-2"><label class="text-sm text-gray-400">Poster URL (optional)</label><input type="url" id="posterUrl" placeholder="https://..." class="mt-1" /></div>
          <div class="sm:col-span-2"><label class="text-sm text-gray-400">Description</label><textarea id="matchDesc" rows="2" class="mt-1"></textarea></div>
        </div>
        <div class="flex gap-3">
          <button class="btn" onclick="saveMatch()">Save Match</button>
          <button class="btn-gray px-4 py-2 rounded-lg hidden" id="cancelEdit" onclick="resetMatchForm()">Cancel</button>
        </div>
      </div>
      <div class="card">
        <h2 class="text-lg font-bold mb-3">All Matches</h2>
        <div id="matchList" class="space-y-2"></div>
      </div>
    </div>

    <!-- SETTINGS TAB -->
    <div id="tab-settings" class="hidden card space-y-4">
      <h2 class="text-lg font-bold">Settings</h2>
      <div>
        <label class="text-sm text-gray-400">Telegram Link</label>
        <input type="url" id="tgLink" placeholder="https://t.me/yourchannel" class="mt-1" />
      </div>
      <div>
        <label class="text-sm text-gray-400">Change Admin Password</label>
        <input type="password" id="newPass" placeholder="New password" class="mt-1" />
        <p class="text-xs text-gray-600 mt-1">Khali chhodoge to password change nahi hoga</p>
      </div>
      <button class="btn" onclick="saveSettings()">Save Settings</button>
    </div>
  </div>

  <script>
    // ========== CONFIG - YAHAN APNI SUPABASE KEYS + PASSWORD DALO ==========
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";
    // Default admin password (pehli baar). Baad me Settings se change kar sakte ho.
    // Password database me save hota hai table: site_settings column: admin_pass
    // ================================================================

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let editId = null;
    let adminPass = "admin123"; // fallback, DB se overwrite hoga

    function toast(text, ok) {
      const el = document.getElementById("msg");
      el.textContent = text;
      el.className = "fixed top-4 right-4 z-50 px-4 py-2 rounded-lg text-sm font-medium " + (ok ? "bg-green-900 text-green-200" : "bg-red-900 text-red-200");
      el.classList.remove("hidden");
      setTimeout(() => el.classList.add("hidden"), 3000);
    }

    function showTab(name) {
      ["stream","matches","settings"].forEach(t => {
        document.getElementById("tab-" + t).classList.toggle("hidden", t !== name);
      });
      document.querySelectorAll(".tab-btn").forEach(b => {
        b.className = "tab-btn text-sm px-4 py-2 rounded-lg " + (b.dataset.tab === name ? "btn" : "btn-gray");
      });
    }

    async function doLogin() {
      const pass = document.getElementById("loginPass").value;
      // Load password from DB
      const { data } = await sb.from("site_settings").select("admin_pass").eq("id", 1).single();
      if (data && data.admin_pass) adminPass = data.admin_pass;
      if (pass === adminPass) {
        sessionStorage.setItem("n4b_auth", "1");
        document.getElementById("loginScreen").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        loadAll();
      } else {
        document.getElementById("loginError").textContent = "Galat password";
        document.getElementById("loginError").classList.remove("hidden");
      }
    }

    function doLogout() {
      sessionStorage.removeItem("n4b_auth");
      location.reload();
    }

    // Auto login check
    if (sessionStorage.getItem("n4b_auth") === "1") {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("adminPanel").classList.remove("hidden");
      loadAll();
    }

    async function loadAll() {
      // Stream
      const { data: s } = await sb.from("stream_config").select("*").eq("id", 1).single();
      if (s) {
        document.getElementById("streamUrl").value = s.stream_url || "";
        document.getElementById("isLive").checked = !!s.is_live;
        document.getElementById("statusDot").className = "h-3 w-3 rounded-full " + (s.is_live ? "bg-green-500 animate-pulse" : "bg-gray-600");
        document.getElementById("statusText").textContent = s.is_live ? "LIVE" : "OFFLINE";
        document.getElementById("statusText").className = s.is_live ? "text-green-400" : "text-gray-500";
      }
      // Matches for dropdown + list
      const { data: matches } = await sb.from("matches").select("*").order("match_date", { ascending: false });
      const sel = document.getElementById("streamMatch");
      sel.innerHTML = '<option value="">— None —</option>';
      (matches || []).filter(m => m.status !== "completed").forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = m.team_a + " vs " + m.team_b;
        if (s && s.current_match_id === m.id) opt.selected = true;
        sel.appendChild(opt);
      });
      // Match list
      document.getElementById("matchList").innerHTML = (matches || []).map(m => `
        <div class="flex flex-wrap items-center justify-between gap-2 border border-gray-800 rounded-lg px-3 py-2 bg-black">
          <div>
            <p class="font-medium text-sm">${m.team_a} <span class="text-brand-red">vs</span> ${m.team_b}</p>
            <p class="text-xs text-gray-500">${new Date(m.match_date).toLocaleString("en-IN")} · ${m.status}</p>
          </div>
          <div class="flex gap-2">
            <button class="btn-gray text-xs px-2 py-1 rounded" onclick='editMatch(${JSON.stringify(m)})'>Edit</button>
            <button class="text-xs px-2 py-1 rounded border border-red-900 text-red-400" onclick="deleteMatch('${m.id}')">Delete</button>
          </div>
        </div>
      `).join("") || '<p class="text-gray-500 text-sm">No matches yet</p>';
      // Settings
      const { data: set } = await sb.from("site_settings").select("*").eq("id", 1).single();
      if (set) {
        document.getElementById("tgLink").value = set.telegram_link || "";
        if (set.admin_pass) adminPass = set.admin_pass;
      }
    }

    async function saveStream() {
      const url = document.getElementById("streamUrl").value.trim();
      const matchId = document.getElementById("streamMatch").value || null;
      const live = document.getElementById("isLive").checked && !!url;
      const { error } = await sb.from("stream_config").update({
        stream_url: url || null,
        is_live: live,
        current_match_id: matchId
      }).eq("id", 1);
      if (error) { toast(error.message, false); return; }
      if (live && matchId) await sb.from("matches").update({ status: "live" }).eq("id", matchId);
      toast(live ? "Stream LIVE ho gaya!" : "Stream update ho gaya", true);
      loadAll();
    }

    async function stopStream() {
      const { data: cur } = await sb.from("stream_config").select("current_match_id").eq("id", 1).single();
      await sb.from("stream_config").update({ stream_url: null, is_live: false, current_match_id: null }).eq("id", 1);
      if (cur && cur.current_match_id) await sb.from("matches").update({ status: "completed" }).eq("id", cur.current_match_id);
      document.getElementById("streamUrl").value = "";
      document.getElementById("isLive").checked = false;
      toast("Stream band — OFFLINE", true);
      loadAll();
    }

    function resetMatchForm() {
      editId = null;
      document.getElementById("matchFormTitle").textContent = "Add Match";
      document.getElementById("teamA").value = "";
      document.getElementById("teamB").value = "";
      document.getElementById("matchDate").value = "";
      document.getElementById("matchStatus").value = "upcoming";
      document.getElementById("posterUrl").value = "";
      document.getElementById("matchDesc").value = "";
      document.getElementById("cancelEdit").classList.add("hidden");
    }

    function editMatch(m) {
      editId = m.id;
      document.getElementById("matchFormTitle").textContent = "Edit Match";
      document.getElementById("teamA").value = m.team_a;
      document.getElementById("teamB").value = m.team_b;
      document.getElementById("matchDate").value = m.match_date ? m.match_date.slice(0, 16) : "";
      document.getElementById("matchStatus").value = m.status;
      document.getElementById("posterUrl").value = m.poster_url || "";
      document.getElementById("matchDesc").value = m.description || "";
      document.getElementById("cancelEdit").classList.remove("hidden");
      showTab("matches");
    }

    async function saveMatch() {
      const team_a = document.getElementById("teamA").value.trim();
      const team_b = document.getElementById("teamB").value.trim();
      const match_date = document.getElementById("matchDate").value;
      if (!team_a || !team_b || !match_date) { toast("Team A, Team B aur Date zaroori hain", false); return; }
      const row = {
        team_a, team_b,
        match_date: new Date(match_date).toISOString(),
        status: document.getElementById("matchStatus").value,
        poster_url: document.getElementById("posterUrl").value.trim() || null,
        description: document.getElementById("matchDesc").value.trim() || null
      };
      let error;
      if (editId) {
        ({ error } = await sb.from("matches").update(row).eq("id", editId));
      } else {
        ({ error } = await sb.from("matches").insert(row));
      }
      if (error) { toast(error.message, false); return; }
      toast(editId ? "Match update ho gaya" : "Match add ho gaya", true);
      resetMatchForm();
      loadAll();
    }

    async function deleteMatch(id) {
      if (!confirm("Delete this match?")) return;
      await sb.from("matches").delete().eq("id", id);
      toast("Match delete ho gaya", true);
      loadAll();
    }

    async function saveSettings() {
      const tg = document.getElementById("tgLink").value.trim();
      const newPass = document.getElementById("newPass").value.trim();
      const update = { telegram_link: tg || "https://t.me/" };
      if (newPass) update.admin_pass = newPass;
      const { error } = await sb.from("site_settings").update(update).eq("id", 1);
      if (error) { toast(error.message, false); return; }
      if (newPass) adminPass = newPass;
      document.getElementById("newPass").value = "";
      toast("Settings save ho gaye", true);
    }

    // Enter key login
    document.getElementById("loginPass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
  </script>
</body>
</html>
