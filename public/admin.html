<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N4B LIVE Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif}
input,select{background:#000;border:1px solid #333;border-radius:8px;padding:12px;width:100%;color:white}
button{cursor:pointer;border-radius:8px;padding:11px 18px;font-weight:600}
.red{background:#e10600;color:white}
.gray{background:#222;border:1px solid #444}
.card{background:#121212;border:1px solid #2a2a2a;border-radius:12px;padding:20px}
</style>
</head>
<body class="p-4">
<div class="max-w-2xl mx-auto mt-8">
<h1 class="text-2xl font-bold mb-6">N4B <span class="text-red-600">LIVE</span> Admin</h1>

<div id="login" class="card mb-5">
<h2 class="font-bold mb-3">Admin Login</h2>
<input id="password" type="password" placeholder="Admin password">
<button class="red w-full mt-3" onclick="login()">Sign In</button>
<p id="loginMsg" class="text-red-400 mt-2"></p>
</div>

<div id="panel" class="hidden space-y-5">
<div class="card space-y-4">
<h2 class="text-xl font-bold">Live Stream Control</h2>

<label class="block text-sm">Stream Type</label>
<select id="type" onchange="changeType()">
<option value="iframe">Authorized iframe embed</option>
<option value="hls">HLS / M3U8 / MP4</option>
</select>

<div id="channelBox">
<label class="block text-sm mb-2">Channel preset</label>
<select id="channel" onchange="chooseChannel()">
<option value="">Choose channel</option>
<option value="ss1hin">Star Sports 1 Hindi</option>
<option value="ss1eng">Star Sports 1 English</option>
<option value="ss1tam">Star Sports 1 Tamil</option>
<option value="ss1tel">Star Sports 1 Telugu</option>
<option value="ss2hin">Star Sports 2 Hindi</option>
<option value="ss2eng">Star Sports 2 English</option>
<option value="ss2tam">Star Sports 2 Tamil</option>
<option value="ss2tel">Star Sports 2 Telugu</option>
</select>
<p class="text-xs text-gray-500 mt-2">
Use only provider-approved embed URLs. Channel page links are not automatically embed URLs.
</p>
</div>

<div>
<label id="urlLabel" class="block text-sm mb-2">Iframe Embed URL</label>
<input id="streamUrl" type="url" placeholder="Paste authorized embed URL">
</div>

<label class="flex items-center gap-2">
<input id="live" type="checkbox" style="width:auto">
Set as LIVE
</label>

<div class="flex gap-3">
<button class="red" onclick="saveStream()">Save & Apply</button>
<button class="gray" onclick="stopStream()">Stop Stream</button>
</div>
<p id="status" class="text-sm text-gray-400"></p>
</div>

<div class="card space-y-3">
<h2 class="text-xl font-bold">Telegram Settings</h2>
<input id="telegram" type="url" placeholder="https://t.me/yourchannel">
<button class="red" onclick="saveTelegram()">Save Telegram Link</button>
</div>
</div>
</div>

<script>
let pass = "";
let data = null;

const channelPages = {
  ss1hin: "https://footxeera1.pages.dev/tara?id=ss1hin",
  ss1eng: "https://footxeera1.pages.dev/tara?id=ss1",
  ss1tam: "https://footxeera1.pages.dev/tara?id=ss1tam",
  ss1tel: "https://footxeera1.pages.dev/tara?id=ss1tel",
  ss2hin: "https://footxeera1.pages.dev/tara?id=ss2h",
  ss2eng: "https://footxeera1.pages.dev/tara?id=ss2",
  ss2tam: "https://footxeera1.pages.dev/tara?id=ss2tam",
  ss2tel: "https://footxeera1.pages.dev/tara?id=ss2tel"
};

async function api(action, payload) {
  const res = await fetch("/api", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({pass, action, data:payload})
  });
  if (!res.ok) throw new Error(res.status === 401 ? "Wrong password" : "API request failed");
  return res.json();
}

async function login() {
  pass = document.getElementById("password").value;
  try {
    data = await api("load");
    sessionStorage.setItem("n4b_pass", pass);
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    render();
  } catch(e) {
    document.getElementById("loginMsg").textContent = e.message;
  }
}

async function init() {
  pass = sessionStorage.getItem("n4b_pass") || "";
  if (!pass) return;
  try {
    data = await api("load");
    document.getElementById("login").classList.add("hidden");
    document.getElementById("panel").classList.remove("hidden");
    render();
  } catch {
    sessionStorage.removeItem("n4b_pass");
    pass = "";
  }
}

function render() {
  const s = data.stream || {};
  document.getElementById("type").value = s.embed_url ? "iframe" : "hls";
  document.getElementById("streamUrl").value = s.embed_url || s.stream_url || "";
  document.getElementById("live").checked = !!s.is_live;
  document.getElementById("telegram").value = data.settings?.telegram_link || "";
  changeType();
}

function changeType() {
  const iframe = document.getElementById("type").value === "iframe";
  document.getElementById("channelBox").classList.toggle("hidden", !iframe);
  document.getElementById("urlLabel").textContent =
    iframe ? "Iframe Embed URL" : "HLS / M3U8 / MP4 URL";
  document.getElementById("streamUrl").placeholder =
    iframe ? "Paste provider-approved embed URL" : "https://example.com/live.m3u8";
}

function chooseChannel() {
  const key = document.getElementById("channel").value;
  if (key) document.getElementById("streamUrl").value = channelPages[key];
}

async function saveStream() {
  const url = document.getElementById("streamUrl").value.trim();
  const live = document.getElementById("live").checked;
  const iframe = document.getElementById("type").value === "iframe";

  if (live && !url) {
    return showStatus("URL paste karo.", false);
  }

  // These presets are page URLs, not verified embed URLs.
  // Confirm external embedding permission with the provider before using them.
  data.stream = {
    stream_url: iframe ? null : (url || null),
    embed_url: iframe ? (url || null) : null,
    is_live: live,
    current_match: data.stream?.current_match || null
  };

  try {
    await api("save", data);
    showStatus("Stream settings saved. Website par test karo.", true);
  } catch(e) {
    showStatus("Save failed: " + e.message, false);
  }
}

async function stopStream() {
  data.stream = {
    stream_url:null,
    embed_url:null,
    is_live:false,
    current_match:null
  };
  try {
    await api("save", data);
    document.getElementById("streamUrl").value = "";
    document.getElementById("live").checked = false;
    showStatus("Stream stopped.", true);
  } catch(e) {
    showStatus("Stop failed: " + e.message, false);
  }
}

async function saveTelegram() {
  data.settings = data.settings || {};
  data.settings.telegram_link =
    document.getElementById("telegram").value.trim() || "https://t.me/";
  try {
    await api("save", data);
    showStatus("Telegram link saved.", true);
  } catch(e) {
    showStatus("Save failed: " + e.message, false);
  }
}

function showStatus(msg, ok) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "text-sm " + (ok ? "text-green-400" : "text-red-400");
}

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});

init();
</script>
</body>
</html>
