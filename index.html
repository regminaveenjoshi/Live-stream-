<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N4B LIVE | Your Home of Live Cricket</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { black:"#0a0a0a", dark:"#121212", red:"#e10600" } } } }
    }
  </script>
  <style>
    body { background:#0a0a0a; color:#fff; font-family:system-ui,sans-serif; }
    .live-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .spinner { border:3px solid rgba(225,6,0,.2); border-top-color:#e10600; border-radius:50%; width:40px; height:40px; animation:spin .8s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }
    .video-box { aspect-ratio:16/9; background:#000; }
  </style>
</head>
<body class="min-h-screen">

  <header class="sticky top-0 z-50 border-b border-gray-800 bg-black/95 backdrop-blur">
    <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-2">
        <div class="h-9 w-9 rounded-lg bg-brand-red flex items-center justify-center font-bold text-sm shadow-lg shadow-red-900/40">N4</div>
        <div>
          <h1 class="text-lg font-bold">N4B <span class="text-brand-red">LIVE</span></h1>
          <p class="text-[10px] uppercase tracking-widest text-gray-500 hidden sm:block">Your Home of Live Cricket</p>
        </div>
      </div>
      <a id="tgBtn" href="https://t.me/" target="_blank" class="flex items-center gap-2 rounded-full bg-[#0088cc] px-4 py-2 text-sm font-semibold hover:bg-[#0077b5]">
        <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69a.2.2 0 00-.05-.18c-.06-.05-.14-.03-.21-.02-.09.02-1.49.95-4.22 2.79-.4.27-.76.41-1.08.4-.36-.01-1.04-.2-1.55-.37-.63-.2-1.12-.31-1.08-.66.02-.18.27-.36.74-.55 2.92-1.27 4.86-2.11 5.83-2.51 2.78-1.16 3.35-1.36 3.73-1.36.08 0 .27.02.39.12.1.08.13.19.14.27-.01.06.01.24 0 .38z"/></svg>
        Telegram
      </a>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6">
    <div class="relative rounded-xl overflow-hidden border border-gray-800 shadow-2xl">
      <div id="liveBadge" class="hidden absolute top-3 left-3 z-20 live-pulse bg-brand-red text-white text-xs font-bold px-2.5 py-1 rounded-md uppercase tracking-wider flex items-center gap-1.5">
        <span class="relative flex h-2 w-2"><span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-white opacity-75"></span><span class="relative inline-flex h-2 w-2 rounded-full bg-white"></span></span>
        LIVE NOW
      </div>
      <div class="video-box relative">
        <div id="offlineScreen" class="absolute inset-0 flex flex-col items-center justify-center gap-3 bg-gradient-to-br from-black via-gray-900 to-black z-10">
          <div class="h-16 w-16 rounded-full border-2 border-gray-700 flex items-center justify-center">
            <svg class="h-8 w-8 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </div>
          <p class="text-xl font-bold text-gray-400">OFFLINE</p>
          <p class="text-sm text-gray-600">No live stream right now</p>
        </div>
        <div id="loadingScreen" class="hidden absolute inset-0 flex items-center justify-center bg-black/70 z-20"><div class="spinner"></div></div>
        <video id="video" class="w-full h-full object-contain" controls playsinline></video>
      </div>
      <div id="matchInfo" class="hidden border-t border-gray-800 bg-brand-dark px-4 py-3">
        <p id="matchTitle" class="font-semibold"></p>
        <p id="matchDate" class="text-sm text-gray-500"></p>
      </div>
    </div>

    <section class="mt-10">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-1 w-8 rounded-full bg-brand-red"></div>
        <h2 class="text-xl font-bold">Upcoming Matches</h2>
      </div>
      <div id="upcomingList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <p class="text-gray-500 col-span-full text-center py-8">Loading...</p>
      </div>
    </section>

    <section class="mt-10">
      <div class="flex items-center gap-3 mb-4">
        <div class="h-1 w-8 rounded-full bg-gray-600"></div>
        <h2 class="text-xl font-bold">Recently Completed</h2>
      </div>
      <div id="completedList" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        <p class="text-gray-500 col-span-full text-center py-8">Loading...</p>
      </div>
    </section>
  </main>

  <footer class="mt-12 border-t border-gray-800 py-8 text-center">
    <div class="flex items-center justify-center gap-2 mb-2">
      <div class="h-7 w-7 rounded bg-brand-red flex items-center justify-center text-xs font-bold">N4</div>
      <span class="font-bold">N4B <span class="text-brand-red">LIVE</span></span>
    </div>
    <p class="text-sm text-gray-500">YOUR HOME OF LIVE CRICKET</p>
    <p class="text-xs text-gray-700 mt-3">© 2026 N4B LIVE</p>
  </footer>

  <script>
    // ========== YAHAN APNI JSONBIN DETAILS DALO ==========
    const BIN_ID = "6ad25dbaffd5d1605371a41d";
const API_KEY = "$2a$10$QPewNjYmnAyrAtzBOPw8pOjfRG4k9//0MvParyYhVTRsNUBhLopZO";
    // =====================================================

    const API = "https://api.jsonbin.io/v3/b/" + BIN_ID;
    let hls = null;
    let lastUrl = "";

    async function getData() {
      const res = await fetch(API + "/latest", {
        headers: { "X-Master-Key": API_KEY }
      });
      if (!res.ok) throw new Error("Data load fail");
      const json = await res.json();
      return json.record;
    }

    function formatDate(d) {
      try {
        return new Date(d).toLocaleString("en-IN", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
      } catch { return d; }
    }

    function matchCard(m, done) {
      const poster = m.poster_url
        ? `<img src="${m.poster_url}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" loading="lazy" alt="">`
        : `<div class="w-full h-full flex items-center justify-center bg-gradient-to-br from-gray-800 to-black text-3xl font-bold text-gray-600">${(m.team_a||"?")[0]} vs ${(m.team_b||"?")[0]}</div>`;
      const badge = m.status === "live"
        ? `<span class="absolute top-2 left-2 bg-brand-red text-white text-[10px] font-bold px-2 py-0.5 rounded live-pulse">LIVE</span>`
        : done ? `<span class="absolute top-2 left-2 bg-gray-700 text-gray-300 text-[10px] font-bold px-2 py-0.5 rounded">COMPLETED</span>` : "";
      return `<article class="group overflow-hidden rounded-xl border border-gray-800 bg-brand-dark hover:-translate-y-1 transition">
        <div class="relative aspect-[16/10] overflow-hidden bg-gray-900">${poster}${badge}</div>
        <div class="p-4">
          <h3 class="font-bold">${m.team_a} <span class="text-brand-red">vs</span> ${m.team_b}</h3>
          <p class="text-sm text-gray-400 mt-1">${formatDate(m.match_date)}</p>
        </div>
      </article>`;
    }

    function playStream(url) {
      if (url === lastUrl && hls) return;
      lastUrl = url;
      const video = document.getElementById("video");
      document.getElementById("offlineScreen").classList.add("hidden");
      document.getElementById("loadingScreen").classList.remove("hidden");
      document.getElementById("liveBadge").classList.remove("hidden");
      if (hls) { hls.destroy(); hls = null; }

      if (url.includes(".m3u8") && Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          document.getElementById("loadingScreen").classList.add("hidden");
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (_, d) => {
          if (d.fatal) { document.getElementById("loadingScreen").classList.add("hidden"); showOffline(); }
        });
      } else {
        video.src = url;
        video.onloadeddata = () => document.getElementById("loadingScreen").classList.add("hidden");
        video.onerror = () => { document.getElementById("loadingScreen").classList.add("hidden"); showOffline(); };
        video.play().catch(() => {});
      }
    }

    function showOffline() {
      if (hls) { hls.destroy(); hls = null; }
      lastUrl = "";
      const video = document.getElementById("video");
      video.removeAttribute("src");
      video.load();
      document.getElementById("offlineScreen").classList.remove("hidden");
      document.getElementById("loadingScreen").classList.add("hidden");
      document.getElementById("liveBadge").classList.add("hidden");
      document.getElementById("matchInfo").classList.add("hidden");
    }

    async function refresh() {
      try {
        const data = await getData();
        // Telegram
        if (data.settings && data.settings.telegram_link) {
          document.getElementById("tgBtn").href = data.settings.telegram_link;
        }
        // Stream
        if (data.stream && data.stream.is_live && data.stream.stream_url) {
          playStream(data.stream.stream_url);
          if (data.stream.current_match) {
            const m = data.stream.current_match;
            document.getElementById("matchTitle").textContent = m.team_a + " vs " + m.team_b;
            document.getElementById("matchDate").textContent = formatDate(m.match_date);
            document.getElementById("matchInfo").classList.remove("hidden");
          }
        } else {
          showOffline();
        }
        // Matches
        const matches = data.matches || [];
        const up = matches.filter(m => m.status === "upcoming" || m.status === "live");
        const done = matches.filter(m => m.status === "completed").slice(-6).reverse();
        document.getElementById("upcomingList").innerHTML = up.length
          ? up.map(m => matchCard(m, false)).join("")
          : `<p class="text-gray-500 col-span-full text-center py-8 border border-dashed border-gray-800 rounded-xl">No upcoming matches</p>`;
        document.getElementById("completedList").innerHTML = done.length
          ? done.map(m => matchCard(m, true)).join("")
          : `<p class="text-gray-500 col-span-full text-center py-8 border border-dashed border-gray-800 rounded-xl">No completed matches</p>`;
      } catch (e) {
        console.error(e);
        document.getElementById("upcomingList").innerHTML = `<p class="text-red-400 col-span-full text-center py-8">Config error — BIN_ID / API_KEY check karo</p>`;
      }
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
